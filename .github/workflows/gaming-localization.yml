name: Gaming localization checker
on:
  push:
    branches: [main]
    paths: ['site/gaming/**', '.github/workflows/gaming-localization.yml']
  pull_request:
    paths: ['site/gaming/**', '.github/workflows/gaming-localization.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/gaming/localization-check/checker.test.cjs
      - run: node --check site/gaming/brief.js && node --check site/gaming/localization-check/checker-ui.js
